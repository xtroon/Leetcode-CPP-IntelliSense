<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetSense Settings</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <svg class="code-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span class="title">LeetSense</span>
        <span class="version">v1.0.0</span>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        <span>Active</span>
      </div>
    </header>

    <div class="section-title">ENGINE PREFERENCES</div>

    <div class="settings">
      <div class="setting-item">
        <div class="setting-text">
          <label for="toggle-autocomplete" class="label">Autocomplete Engine</label>
          <p class="description">Scope-aware variables & STL member completions</p>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggle-autocomplete" checked>
          <span class="track"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-text">
          <label for="toggle-snippets" class="label">CP Code Snippets</label>
          <p class="description">Shortcuts (<code>fori</code>, <code>fore</code>, <code>sortv</code>, <code>pb</code>)</p>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggle-snippets" checked>
          <span class="track"></span>
        </label>
      </div>
    </div>

    <footer class="footer">
      <span>Monaco Editor Integration</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
