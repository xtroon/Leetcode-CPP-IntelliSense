<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode C++ IntelliSense</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-row">
        <img src="icon.png" alt="Logo" class="logo-icon">
        <h2>C++ IntelliSense</h2>
        <span class="version">v1.0</span>
      </div>
      <p class="desc">VS Code autocomplete for LeetCode Monaco editor</p>
    </header>

    <div class="card">
      <div class="row">
        <div class="info">
          <label for="enableAutocomplete">Autocomplete Engine</label>
          <span>Variables, primitives & STL methods</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="enableAutocomplete" checked>
          <span class="track"></span>
        </label>
      </div>

      <div class="separator"></div>

      <div class="row">
        <div class="info">
          <label for="enableSnippets">CP Snippets</label>
          <span>fori, fore, sortv, bfs, dfs & templates</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="enableSnippets" checked>
          <span class="track"></span>
        </label>
      </div>

      <div class="separator"></div>

      <div class="row">
        <div class="info">
          <label for="enableScopeAwareness">Scope Awareness</label>
          <span>Filter variables outside current block</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="enableScopeAwareness" checked>
          <span class="track"></span>
        </label>
      </div>
    </div>

    <footer class="footer">
      <div class="status">
        <span class="dot"></span>
        <span>Active on LeetCode</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
